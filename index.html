<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffc93c">
  <title>Petualangan Sistem Gerak - Kelas 4</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sistem Gerak">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <button id="mus" class="mus" aria-label="Nyalakan atau matikan musik" hidden>🔊</button>
  <header><h1>Petualangan Sistem Gerak</h1><p>Kelas 4 · Tema 3 Sistem Tubuh · Subtema 1</p></header>
  <main id="app"></main>
  <div id="curtain" aria-hidden="true"></div>
  <footer>Sumber materi: Modul Belajar Literasi dan Numerasi SD, Kemendikbud 2020</footer>
  <script>
    /* Muat berurutan: Three.js dari folder lib/ (offline) -> jika tidak ada, dari internet -> jika gagal, aplikasi memakai gambar SVG */
    (function(){
      var CDN='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      function muat(src,ok,gagal){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=gagal||ok;document.body.appendChild(s);}
      function app(){muat('karakter3d.js',function(){muat('materi3d.js',function(){muat('script.js');});});}
      muat('lib/three.min.js',app,function(){muat(CDN,app,app);});
    })();
  </script>
  <script>
    /* PWA: hanya aktif jika dibuka lewat https:// atau localhost */
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))
      navigator.serviceWorker.register('sw.js').catch(()=>{});
  </script>
</body>
</html>
